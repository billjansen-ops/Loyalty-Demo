<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MEDS - Client Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="buttons.css">
  <style>
    /* LONGORIA: Compact scroll layout */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .app-layout { height: calc(100vh - 48px) !important; min-height: auto !important; display: block; }
    .main-content { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
    .page-header { flex-shrink: 0; padding: 12px 20px; border-bottom: 1px solid #e5e7eb; background: white; }
    .page-content { flex: 1; overflow-y: auto; padding: 16px 20px; }

    .page-title { font-size: 20px; font-weight: 600; margin: 0; color: #111827; }
    .page-subtitle { font-size: 13px; color: #6b7280; margin: 4px 0 0; }

    .table-container { background: white; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .table-header { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .table-header h2 { margin: 0; font-size: 14px; font-weight: 600; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { background: #f9fafb; padding: 6px 10px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e5e7eb; }
    .data-table td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; vertical-align: middle; }
    .data-table tbody tr:hover { background: #fafafa; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-inactive { background: #f3f4f6; color: #6b7280; }
    .badge-count { background: rgba(59,130,246,0.12); color: #1e40af; }
    .badge-open { background: #fef3c7; color: #92400e; }

    .code-cell { font-family: monospace; font-weight: 600; }

    .tenant-indicator { padding: 6px 10px; border-radius: 4px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
    .tenant-indicator.info { background: var(--primary-light, #dbeafe); color: var(--primary-dark, #1e40af); border: 1px solid var(--primary, #3b82f6); }
    .tenant-indicator.warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

    .btn-sm { padding: 3px 8px !important; font-size: 11px !important; }
    .row-actions { display: flex; gap: 4px; flex-wrap: nowrap; }
  </style>
</head>
<body>
  <script src="brand-loader.js"></script>
  <div class="app-layout">
    <main class="main-content">
      <div class="page-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h1 class="page-title">📡 MEDS — Missing Event Detection</h1>
            <p class="page-subtitle">Notices what didn't happen — members matching a quiet-spell definition are identified once per episode, and the results fire</p>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div id="tenantIndicator"></div>
            <a href="admin_rules.html" class="btn btn-secondary">← Back to Rules</a>
          </div>
        </div>
      </div>

      <div class="page-content">
        <div class="table-container">
          <div class="table-header">
            <h2>MEDs</h2>
            <a href="admin_med_edit.html" class="btn btn-primary">+ Add New MED</a>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 130px;">Code</th>
                <th>Name</th>
                <th style="width: 180px;">Window</th>
                <th style="width: 80px;">Mode</th>
                <th style="width: 80px;">Criteria</th>
                <th style="width: 80px;">Results</th>
                <th style="width: 110px;">Open episodes</th>
                <th style="width: 90px;">Fired ever</th>
                <th style="width: 80px;">Status</th>
                <th style="width: 170px;">Actions</th>
              </tr>
            </thead>
            <tbody id="medsBody">
              <tr><td colspan="10" class="empty-state">Loading MEDs...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = window.LP_STATE?.apiBase || window.location.origin;

    function showTenantIndicator() {
      const tenantId = sessionStorage.getItem('tenant_id');
      const tenantName = sessionStorage.getItem('tenant_name');
      const indicator = document.getElementById('tenantIndicator');
      if (!tenantId) {
        indicator.innerHTML = `<span class="tenant-indicator warning">⚠️ <a href="menu.html" style="text-decoration: underline;">Select tenant</a></span>`;
      } else {
        indicator.innerHTML = `<span class="tenant-indicator info">${tenantName}</span>`;
      }
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadMeds() {
      const tenantId = sessionStorage.getItem('tenant_id');
      showTenantIndicator();
      if (!tenantId) {
        document.getElementById('medsBody').innerHTML =
          '<tr><td colspan="10" class="empty-state">Please select a tenant from the menu to view MEDs.</td></tr>';
        return;
      }
      try {
        const response = await fetch(`${API_BASE}/v1/meds?tenant_id=${tenantId}`);
        if (!response.ok) throw new Error(`Failed to load MEDs (${response.status})`);
        const meds = await response.json();
        const tbody = document.getElementById('medsBody');
        if (!meds || meds.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No MEDs yet. Click "Add New MED" to create the first one.</td></tr>';
          return;
        }
        tbody.innerHTML = meds.map(d => `
          <tr>
            <td class="code-cell">${esc(d.med_code)}</td>
            <td>${esc(d.med_name)}</td>
            <td style="font-size: 12px;">${esc(d.start_date)} → ${esc(d.end_date)}</td>
            <td>${d.run_mode === 'M' ? 'Manual' : 'Automatic'}</td>
            <td>${d.criteria_count > 0 ? d.criteria_count : '<span style="color:#9ca3af;">none</span>'}</td>
            <td>${d.result_count > 0 ? d.result_count : '<span style="color:#9ca3af;">watch only</span>'}</td>
            <td>${d.open_episodes > 0 ? `<span class="badge badge-open">${d.open_episodes}</span>` : '0'}</td>
            <td><span class="badge badge-count">${d.fired_total}</span></td>
            <td><span class="badge ${d.is_active ? 'badge-active' : 'badge-inactive'}">${d.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>
              <div class="row-actions">
                <button class="btn btn-sm btn-edit" onclick="editMed('${esc(d.med_code)}')" title="Edit MED">✏️ Edit</button>
                <button class="btn btn-sm btn-delete" onclick="deleteMed('${esc(d.med_code)}')" title="Delete MED">🗑️ Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Error loading MEDs:', error);
        document.getElementById('medsBody').innerHTML =
          '<tr><td colspan="10" class="empty-state">Error loading MEDs. Please try again.</td></tr>';
      }
    }

    function editMed(code) {
      window.location.href = `admin_med_edit.html?code=${encodeURIComponent(code)}`;
    }

    async function deleteMed(code) {
      if (!confirm(`Delete MED "${code}"? (Once a MED has fired, delete is refused — deactivate instead.)`)) return;
      try {
        const tenantId = sessionStorage.getItem('tenant_id') || '1';
        const response = await fetch(`${API_BASE}/v1/meds/${encodeURIComponent(code)}?tenant_id=${tenantId}`, { method: 'DELETE' });
        const data = await response.json();
        if (response.ok) {
          loadMeds();
        } else {
          alert(data.error || 'Failed to delete MED');
        }
      } catch (error) {
        console.error('Error deleting MED:', error);
        alert('Error deleting MED');
      }
    }

    loadMeds();
  </script>
  <script src="lp-header.js"></script>
  <script>LPHeader.init({ area: 'client-admin' });</script>
</body>
</html>
